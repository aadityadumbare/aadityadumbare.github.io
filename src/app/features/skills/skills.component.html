<section class="section" id="skills">
  <div class="container">
    <app-section-header label="02 / Capabilities" title="What I build with"></app-section-header>

    <div class="skills__index">
      @for (cat of skillCategories(); track cat.title; let i = $index) {
        <article class="skill-row" appReveal [delay]="i * 80">
          <div class="skill-row__head">
            <span class="skill-row__index" aria-hidden="true">{{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</span>
            <h3 class="skill-row__title">{{ cat.title }}</h3>
          </div>
          <ul class="skill-row__list">
            @for (item of cat.items; track item) {
              <li class="skill-row__item">{{ item }}</li>
            }
          </ul>
        </article>
      } @empty {
        <p class="skills__empty">No skills to show for this perspective.</p>
      }
    </div>
  </div>
</section>
