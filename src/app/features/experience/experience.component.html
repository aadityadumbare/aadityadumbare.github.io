<section class="section" id="experience">
  <div class="container">
    <app-section-header label="04 / Experience" title="Where I've worked"></app-section-header>

    <ol class="ledger">
      @for (item of experience(); track item.role + item.company; let i = $index) {
        <li class="ledger__item" appReveal [delay]="i * 80">
          <div class="ledger__period">{{ item.period }}</div>
          <div class="ledger__detail">
            <h3 class="ledger__role">{{ item.role }}</h3>
            <p class="ledger__company">{{ item.company }}</p>
            <p class="ledger__desc">{{ item.description }}</p>
          </div>
        </li>
      } @empty {
        <li class="ledger__empty">No roles to show for this perspective.</li>
      }
    </ol>
  </div>
</section>
