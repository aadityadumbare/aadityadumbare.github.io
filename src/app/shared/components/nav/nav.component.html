<header class="header" [class.header--scrolled]="isScrolled()" [class.header--open]="isMenuOpen()">
  <div class="header__progress" #progress aria-hidden="true"></div>

  <div class="container nav">
    <a href="#home" class="nav__logo" [class.nav__logo--spin]="spinning()" (dblclick)="spinLogo()">
      aditya<span class="nav__logo-dot">.</span>dumbare
    </a>

    <nav class="nav__menu" [class.nav__menu--open]="isMenuOpen()" aria-label="Primary">
      @for (link of navLinks(); track link.hash; let i = $index) {
        <a [href]="link.hash" class="nav__link" (click)="closeMenu()">
          <span class="nav__link-index" aria-hidden="true">{{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</span>
          <span class="nav__link-label">{{ link.label }}</span>
        </a>
      }
    </nav>

    <div class="nav__actions">
      <app-mode-switcher></app-mode-switcher>

      <button
        type="button"
        class="nav__egg"
        (click)="ui.openDiscoveries()"
        [attr.aria-label]="
          'Hidden features: ' + achievements.found().size + ' of ' + achievements.total + ' found'
        "
        title="There are secrets hidden on this page"
      >
        <span class="nav__egg-icon" aria-hidden="true"></span>
        <span class="nav__egg-count" aria-hidden="true">
          {{ achievements.found().size }}/{{ achievements.total }}
        </span>
      </button>

      <button
        class="nav__icon-btn"
        type="button"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.theme() === 'dark') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <button
        class="nav__toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
      </button>
    </div>
  </div>
</header>
